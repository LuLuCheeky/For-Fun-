<html>
<canvas id="game" width="200" height="200"></canvas>
<p id="score">Score: 0</p>
<button onclick="restart()">Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let snake, food, dir, score, game;

function init(){
  snake = [{x:10,y:10}];
  food = {x:5,y:5};
  dir = {x:1,y:0};
  score = 0;
  document.getElementById("score").innerText = "Score: " + score;
  if(game) clearInterval(game);
  game = setInterval(loop,100);
}

function loop(){
  let head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  
  // Check collisions
  if(head.x<0||head.y<0||head.x>=20||head.y>=20||snake.some(p=>p.x===head.x&&p.y===head.y)){
    clearInterval(game);
    ctx.fillStyle="black"; ctx.fillRect(0,0,200,200);
    ctx.fillStyle="white"; ctx.font="20px Arial";
    ctx.fillText("Game Over!",50,100);
    return;
  }
  
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById("score").innerText = "Score: " + score;
    food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
  } else snake.pop();
  
  // Draw
  ctx.fillStyle="black"; ctx.fillRect(0,0,200,200);
  ctx.fillStyle="lime"; snake.forEach(p=>ctx.fillRect(p.x*10,p.y*10,10,10));
  ctx.fillStyle="red"; ctx.fillRect(food.x*10,food.y*10,10,10);
}

document.onkeydown=e=>{
  if(e.key==="ArrowUp" && dir.y===0) dir={x:0,y:-1};
  if(e.key==="ArrowDown" && dir.y===0) dir={x:0,y:1};
  if(e.key==="ArrowLeft" && dir.x===0) dir={x:-1,y:0};
  if(e.key==="ArrowRight" && dir.x===0) dir={x:1,y:0};
};

function restart(){
  init();
}

init();
</script>
</html>
